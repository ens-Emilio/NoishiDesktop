name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --workspaces
      - name: Typecheck
        run: npx tsc --noEmit -p apps/desktop
      - name: Build
        run: npm run build --workspace apps/desktop
        env:
          ELECTRON_MAJOR_VER: 33
      - name: Package (AppImage)
        run: cd apps/desktop && npx electron-builder --linux AppImage --publish never
        env:
          ELECTRON_MAJOR_VER: 33
      - uses: actions/upload-artifact@v4
        with:
          name: Noishi-AppImage
          path: apps/desktop/dist/*.AppImage
